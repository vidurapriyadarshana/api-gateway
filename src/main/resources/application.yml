server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: client-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/clients,/api/v1/clients/**
        - id: subscription-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/subscriptions,/api/v1/subscriptions/**
        - id: invoice-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/invoices,/api/v1/invoices/**
        - id: payment-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/payments,/api/v1/payments/**
        - id: ticket-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/tickets,/api/v1/tickets/**
        - id: comment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/comments,/api/v1/comments/**
        - id: product-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/products,/api/v1/products/**
        - id: license-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/licenses,/api/v1/licenses/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
